name: tests

# The interpreter range here is the range pyproject.toml declares. 3.14 joined
# on 2026-09-12 because the whole suite already passes on it locally, which made
# the old "<3.14" bound a claim about installability rather than about the code.
# Windows and macOS 3.14 are unverified as of that date; fail-fast is off, so a
# failure on one of them is reported without hiding the other two.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # PyQt6 ships Qt itself, but Qt still loads these from the system, even
      # for the offscreen platform the tests run on. QtNetwork wants the Kerberos
      # library, and the widgets want fontconfig, whether or not anything is
      # ever drawn.
      - name: Install the Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0 \
            libfontconfig1 libfreetype6 libgssapi-krb5-2

      - name: Install PyQt6
        run: python -m pip install --quiet "PyQt6>=6.6,<7"

      # Nothing else is needed: the code is standard library and PyQt6, and the
      # tests reach neither the network nor a sound device.
      - name: Run the tests
        run: python -m unittest discover --verbose

      # The interface is a set of surfaces, and one of them quietly failing to
      # draw looks exactly like a passing test run. This renders every surface
      # offscreen and fails when one is missing or holds a single colour
      # (docs/ai/ROADMAP.md T0.5). Linux only: the offscreen platform and the
      # frames it produces are the ones verified here.
      - name: Render every interface surface
        run: |
          python tools/shoot_ui.py --out /tmp/dikte-shots \
            --themes light,dark --langs en,tr --check

      - name: Check for whitespace errors
        run: git diff --check

      - name: Scan tracked files for token-like secrets
        run: python -m unittest tests.test_repo_hygiene -v

  test-windows:
    # The Windows port is first-class: same tests, same expectations.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install PyQt6
        run: python -m pip install --quiet "PyQt6>=6.6,<7"

      - name: Run the tests
        run: python -m unittest discover --verbose

      - name: Check for whitespace errors
        run: git diff --check

      - name: Scan tracked files for token-like secrets
        run: python -m unittest tests.test_repo_hygiene -v

  test-macos:
    # macOS is supported in code (clipboard/keyboard paths) so it gets the
    # same import/unit/smoke gate as the other two.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install PyQt6
        run: python -m pip install --quiet "PyQt6>=6.6,<7"

      - name: Run the tests
        run: python -m unittest discover --verbose

      - name: Check for whitespace errors
        run: git diff --check

      - name: Scan tracked files for token-like secrets
        run: python -m unittest tests.test_repo_hygiene -v
