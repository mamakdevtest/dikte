name: build

# The `tests` workflow proves the code runs from a checkout. This one proves the *bundle*
# runs — on three platforms, because a packaging failure is platform-shaped and the two
# nobody develops on are exactly where it hides.
#
# What it asserts is not "PyInstaller exited 0" but the three things `packaging/build.py`
# checks by actually starting the artifact: the interpreter and the module imports are
# inside, the application diagnoses itself, and a window reaches its event loop. A bundle
# that builds and cannot start is the normal shape of this failure, and it is the one an
# exit code says nothing about.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  frozen:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # A bundle is built on one interpreter. 3.13 is the newest with the widest
          # bootloader and wheel support; the `tests` workflow is where 3.11–3.14 are all
          # exercised, on all three platforms. pyproject allows 3.11+, so what ships must
          # not depend on this choice being the newest.
          python-version: "3.13"

      # Qt loads these from the system even for the offscreen platform the window check
      # uses, and even when nothing is ever drawn.
      - name: Install the Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0 \
            libfontconfig1 libfreetype6 libgssapi-krb5-2

      - name: Install PyQt6 and the packaging tool
        run: python -m pip install --quiet -r packaging/requirements-build.txt

      # Builds, then checks: --help, doctor --json, and a window that reaches its event
      # loop offscreen. Exits non-zero with the failing check's own output.
      - name: Build the frozen application and prove it starts
        run: python packaging/build.py

      # T5.4, and the reason this job exists at all: PowerShell cannot be checked from
      # Linux, so the runner is where the installer gets looked at. A throwaway machine,
      # installed from the bundle, with -NoLaunch because the job must not wait on a GUI
      # designed to stay up.
      - name: Install it the way a user does (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 -NoLaunch
          $shim = Join-Path $env:LOCALAPPDATA "Programs\Dikte\dikte.cmd"
          if (-not (Test-Path $shim)) { throw "install.ps1 created no shim at $shim" }
          Write-Host "installed command:"; Get-Content $shim
          $out = & $shim --help
          if ($LASTEXITCODE -ne 0) { throw "the installed command exited $LASTEXITCODE" }
          $out | Select-Object -First 3
          # the console-less twin is what the shortcuts point at; if it is missing, the
          # shortcuts would flash a console, which is the defect T5.4 exists to remove
          if (-not (Test-Path "dist\dikte\diktew.exe")) { throw "the bundle has no diktew.exe" }

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: dikte-${{ runner.os }}
          path: dist/
          if-no-files-found: error
