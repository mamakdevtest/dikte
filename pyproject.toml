[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dikte"
version = "1.0.0"
description = "Local-first voice dictation, transcription and cleanup desktop app"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "PyQt6>=6.6,<7",
]

[dependency-groups]
test = []
dev = []

[tool.setuptools]
py-modules = [
    "api", "assistant", "audio", "chunked_session", "cleanup", "cli",
    "config", "dikte", "filetranscribe", "ggml", "hotkey", "hub", "i18n",
    "ipc", "livetext", "meeting", "overlay", "paste", "providers", "vad",
    "version", "voice_jobs", "wasapi", "worker",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
