[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dikte"
version = "1.0.0"
description = "Local-first voice dictation, transcription and cleanup desktop app"
readme = "README.md"
requires-python = ">=3.11,<3.15"
# The repository declares GPL-3.0 (LICENSE, README) while this line says MIT,
# and the two cannot both be true: PyQt6 is GPL-3.0-or-commercial, so a
# permissive licence here is not merely inaccurate, it is unshippable. The
# correction is an open product decision, tracked as Q1 in docs/ai/ROADMAP.md —
# either this becomes "GPL-3.0" and PyQt6 stays, or the bindings move to
# PySide6 (LGPL) and the metadata is free to be permissive.
license = { text = "MIT" }
dependencies = [
    "PyQt6>=6.6,<7",
]

[dependency-groups]
test = []
dev = []

[tool.setuptools]
py-modules = [
    "api", "assistant", "audio", "chunked_session", "cleanup", "cli",
    "config", "dikte", "filetranscribe", "ggml", "hotkey", "hub", "i18n",
    "ipc", "livetext", "meeting", "overlay", "paste", "providers", "vad",
    "version", "voice_jobs", "wasapi", "worker",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
