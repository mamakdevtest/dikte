[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dikte"
version = "1.0.0"
description = "Local-first voice dictation, transcription and cleanup desktop app"
readme = "README.md"
requires-python = ">=3.11,<3.15"
# GPL-3.0-only, which is what LICENSE and both READMEs have always said. PyQt6 is
# GPL-3.0-or-commercial, so the permissive licence this line used to declare was never
# shippable; the other way out (PySide6, LGPL) was weighed and rejected. Q1 is answered
# in docs/ai/DECISIONS.md.
license = { text = "GPL-3.0-only" }
dependencies = [
    "PyQt6>=6.6,<7",
]

[dependency-groups]
test = []
dev = []

[tool.setuptools]
py-modules = [
    "api", "assistant", "audio", "chunked_session", "cleanup", "cli",
    "config", "dikte", "filetranscribe", "ggml", "hotkey", "hub", "i18n",
    "ipc", "livetext", "meeting", "overlay", "paste", "providers", "vad",
    "version", "voice_jobs", "wasapi", "worker",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
